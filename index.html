<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RachaKmap</title>
<style>
  :root{
    --bg:#0e0f13; --bg2:#151822; --bg3:#1c2030; --bg4:#232838;
    --line:#2a3042; --line2:#39415a;
    --txt:#e7e9f0; --muted:#98a1b8; --faint:#6b7488;
    --accent:#6c8cff; --accent-d:#4f6ffe;
    --cyan:#22d3ee; --amber:#f6b64b; --green:#34d399; --red:#f8717a; --violet:#a78bfa;
    --radius:14px; --radius-s:9px;
    --mono:ui-monospace,"Cascadia Code","JetBrains Mono",Consolas,monospace;
    --sans:"Segoe UI",system-ui,-apple-system,"Noto Sans Thai",sans-serif;
    --cols:4; --rows:2;
    --shadow:0 6px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{height:100%}
  body{
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(108,140,255,.10), transparent 60%),
      radial-gradient(900px 500px at 0% 0%, rgba(34,211,238,.06), transparent 55%),
      var(--bg);
    color:var(--txt); font-family:var(--sans); font-size:15px; line-height:1.45;
    height:100vh; overflow:hidden;                 /* whole app fits one screen — no page scroll */
    display:flex; flex-direction:column; -webkit-font-smoothing:antialiased;
  }
  ::selection{background:rgba(108,140,255,.35)}

  /* ---------- Top toolbar ---------- */
  header.bar{
    flex:0 0 auto; z-index:50;
    background:linear-gradient(180deg, rgba(21,24,34,.96), rgba(21,24,34,.86));
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    box-shadow:0 4px 20px rgba(0,0,0,.35);
  }
  .bar-inner{max-width:1680px; margin:0 auto; padding:9px 20px; display:flex; flex-direction:column; gap:8px}
  .brand{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
  .logo{
    width:38px;height:38px;border-radius:10px;flex:0 0 auto;
    background:linear-gradient(135deg,var(--accent),var(--cyan));
    display:grid;place-items:center;font-weight:800;color:#0b0d12;font-size:18px;
    box-shadow:0 4px 14px rgba(108,140,255,.4);
  }
  .brand h1{font-size:17px; margin:0; font-weight:700; letter-spacing:.2px}
  .brand .sub{font-size:12.5px; color:var(--muted); margin-top:1px}

  .controls{display:flex; gap:10px 14px; flex-wrap:wrap; align-items:flex-end}
  .field{display:flex; flex-direction:column; gap:5px}
  .field > label{font-size:11px; color:var(--muted); font-weight:600; letter-spacing:.4px; text-transform:uppercase}
  .inp, select.inp{
    background:var(--bg3); color:var(--txt); border:1px solid var(--line2);
    border-radius:9px; padding:8px 10px; font-size:14px; font-family:var(--sans);
    outline:none; transition:border-color .15s, box-shadow .15s;
  }
  .inp:focus, select.inp:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(108,140,255,.22)}
  .inp.num{width:74px; text-align:center; font-family:var(--mono)}
  select.inp{cursor:pointer; padding-right:26px; appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%; background-size:5px 5px,5px 5px; background-repeat:no-repeat}
  .time-group{display:flex; align-items:center; gap:6px}
  .time-group .inp.num{width:58px}
  .time-group span{color:var(--muted); font-weight:700}
  /* per-method timer settings, color-matched to the sections */
  .time-kmap>label{color:var(--cyan)}
  .time-bool>label{color:var(--amber)}
  .time-kmap .inp{border-color:rgba(34,211,238,.4)}
  .time-kmap .inp:focus{border-color:var(--cyan); box-shadow:0 0 0 3px rgba(34,211,238,.18)}
  .time-bool .inp{border-color:rgba(246,182,75,.4)}
  .time-bool .inp:focus{border-color:var(--amber); box-shadow:0 0 0 3px rgba(246,182,75,.18)}

  .divider{width:1px; align-self:stretch; background:var(--line); margin:2px 2px}

  .btn{
    border:1px solid var(--line2); background:var(--bg3); color:var(--txt);
    border-radius:9px; padding:8px 13px; font-size:13.5px; font-weight:600;
    cursor:pointer; font-family:var(--sans); display:inline-flex; align-items:center; gap:7px;
    transition:transform .05s, background .15s, border-color .15s, box-shadow .15s; white-space:nowrap;
  }
  .btn:hover{border-color:var(--line2); background:var(--bg4)}
  .btn:active{transform:translateY(1px)}
  .btn .ic{font-size:15px; line-height:1}
  .btn.primary{background:linear-gradient(180deg,var(--accent),var(--accent-d)); border-color:transparent; color:#fff; box-shadow:0 3px 12px rgba(79,111,254,.35)}
  .btn.primary:hover{filter:brightness(1.07)}
  .btn.ghost{background:transparent}
  .btn.danger{color:var(--red); border-color:rgba(248,113,122,.35)}
  .btn.danger:hover{background:rgba(248,113,122,.12)}
  .btn.warn{color:var(--amber); border-color:rgba(246,182,75,.35)}
  .btn.warn:hover{background:rgba(246,182,75,.12)}
  .btn:disabled{opacity:.4; cursor:not-allowed; transform:none}

  .global-actions{display:flex; gap:9px; flex-wrap:wrap; align-items:center}
  .spacer{flex:1 1 auto}

  /* ---------- Grid ---------- */
  main{max-width:1680px; width:100%; margin:0 auto; padding:12px 16px; flex:1 1 auto; min-height:0; overflow:hidden}
  .grid{display:grid; height:100%;
    grid-template-columns:repeat(var(--cols),minmax(0,1fr));
    grid-template-rows:repeat(var(--rows,2),minmax(0,1fr)); gap:14px}

  /* ---------- Card ---------- */
  .card{
    background:linear-gradient(180deg,var(--bg2),#12141d);
    border:1px solid var(--line); border-radius:var(--radius);
    display:flex; flex-direction:column; overflow:hidden; min-height:0;   /* fills its grid cell; sections shrink to fit one screen */
    box-shadow:var(--shadow);
  }
  /* method color — makes K-Map vs Boolean sections instantly distinguishable */
  .card.m-kmap{--mc:#22d3ee; --mc-bg:rgba(34,211,238,.12); --mc-bd:rgba(34,211,238,.55)}
  .card.m-bool{--mc:#f6b64b; --mc-bg:rgba(246,182,75,.13); --mc-bd:rgba(246,182,75,.55)}
  .card.m-kmap,.card.m-bool{border-color:var(--mc-bd)}
  /* phase state shown as an inset glow so it never hides the method border */
  .card.running{box-shadow:inset 0 0 0 1px rgba(108,140,255,.30), var(--shadow)}
  .card.revealed{box-shadow:inset 0 0 0 1px rgba(52,211,153,.40), var(--shadow)}
  .card.timeout{box-shadow:inset 0 0 0 2px rgba(248,113,122,.60), var(--shadow)}

  .c-head{display:flex; align-items:center; justify-content:space-between; padding:10px 13px 9px; border-bottom:1px solid var(--line)}
  .card.m-kmap .c-head,.card.m-bool .c-head{background:var(--mc-bg); border-bottom-color:var(--mc-bd)}
  .c-title{display:flex; align-items:center; gap:8px; font-weight:700; font-size:13.5px; color:var(--muted)}
  .c-num{width:22px;height:22px;border-radius:7px;background:var(--bg4);display:grid;place-items:center;font-family:var(--mono);font-size:12px;color:var(--txt)}
  .card.m-kmap .c-num,.card.m-bool .c-num{color:var(--mc); background:var(--mc-bg)}
  .badge{font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; letter-spacing:.3px; border:1px solid transparent; opacity:0; transition:opacity .2s}
  .badge.show{opacity:1}
  .badge.kmap{color:var(--cyan); background:rgba(34,211,238,.12); border-color:rgba(34,211,238,.35)}
  .badge.bool{color:var(--amber); background:rgba(246,182,75,.12); border-color:rgba(246,182,75,.35)}

  /* timer */
  .c-timer{padding:12px 13px 10px; display:flex; align-items:center; gap:12px}
  .t-clock{font-family:var(--mono); font-size:30px; font-weight:700; letter-spacing:1px; line-height:1; font-variant-numeric:tabular-nums}
  .t-clock.warn{color:var(--amber)} .t-clock.crit{color:var(--red)} .t-clock.done{color:var(--red)}
  .t-clock.idle{color:var(--faint)}
  .t-meta{display:flex; flex-direction:column; gap:3px; font-size:11.5px; color:var(--muted)}
  .t-status{font-weight:600}
  .t-status.run{color:var(--accent)} .t-status.done{color:var(--red)} .t-status.rev{color:var(--green)}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:5px;vertical-align:middle}
  .dot.pulse{animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(108,140,255,.5)}50%{opacity:.55;box-shadow:0 0 0 5px rgba(108,140,255,0)}}
  .t-track{height:5px; background:var(--bg4); border-radius:4px; overflow:hidden; margin:0 13px 12px}
  .t-fill{height:100%; width:100%; background:var(--green); border-radius:4px; transition:width .25s linear, background .3s}
  .t-fill.up{background:linear-gradient(90deg,var(--accent),var(--cyan)); background-size:200% 100%; animation:slide 1.6s linear infinite}
  @keyframes slide{0%{background-position:0 0}100%{background-position:200% 0}}

  /* problem */
  .c-body{padding:4px 13px 13px; flex:1 1 auto; display:flex; flex-direction:column; overflow-y:auto; min-height:0}
  .c-body::-webkit-scrollbar{width:8px}
  .c-body::-webkit-scrollbar-thumb{background:var(--line2); border-radius:8px}
  .c-body::-webkit-scrollbar-track{background:transparent}
  .c-content{display:flex; flex-direction:column; gap:10px; flex:1 1 auto; min-height:0}  /* fills card; content top-aligned so the problem never moves when the answer appears */
  .prob.empty{margin:auto 0}   /* only the idle placeholder is vertically centered */
  .prob{
    background:var(--bg3); border:1px solid var(--line); border-radius:var(--radius-s);
    padding:11px 12px; font-family:var(--mono); font-size:15px; line-height:1.6; word-break:break-word;
  }
  .prob.empty{color:var(--faint); font-family:var(--sans); font-size:13.5px; text-align:center; padding:20px 12px; border-style:dashed}
  .prob .fn{color:var(--txt)}
  .sig{color:var(--violet); font-weight:700}
  .sig sub{font-size:.7em; font-weight:700}
  .mm{color:var(--cyan)} .dd{color:var(--amber)}
  .instr{font-family:var(--sans); font-size:12.5px; color:var(--txt); margin-top:8px; padding:6px 10px;
    border-radius:8px; border-left:3px solid var(--mc,var(--line2)); background:var(--mc-bg,transparent); font-weight:600}
  .instr b{color:var(--mc,var(--txt)); font-weight:800}

  /* answer */
  .answer{border:1px solid rgba(52,211,153,.3); background:rgba(52,211,153,.06); border-radius:var(--radius-s); padding:11px; display:none}
  .answer.show{display:block; animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .ans-label{font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--green); font-weight:700; display:flex; align-items:center; gap:6px; margin-bottom:7px}
  .ans-eq{font-family:var(--mono); font-size:16px; font-weight:700; line-height:1.65; color:#eafff5; word-break:break-word}
  .ov{text-decoration:overline; text-decoration-thickness:1.5px}
  .op{color:var(--muted); margin:0 4px; font-weight:600} .term{white-space:nowrap}
  .ans-meta{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:7px; font-size:11.5px; color:var(--muted)}
  .chip{background:var(--bg4); border:1px solid var(--line2); border-radius:20px; padding:2px 9px; font-family:var(--mono)}
  .chip.time{color:var(--green); border-color:rgba(52,211,153,.35)}
  .ans-note{font-size:11px; color:var(--muted); margin-top:8px}
  .mini{margin-left:auto; background:transparent; border:1px solid var(--line2); color:var(--muted); border-radius:7px; padding:3px 8px; font-size:11.5px; cursor:pointer; font-family:var(--sans)}
  .mini:hover{color:var(--txt); border-color:var(--line2); background:var(--bg4)}

  /* kmap */
  .kmap{margin-top:11px; display:none}
  .kmap.show{display:block}
  .kmsvg{width:100%; max-width:252px; height:auto; display:block; margin-top:5px}
  .kmc{fill:var(--bg3); stroke:var(--line2); stroke-width:1}
  .kmc.one{fill:rgba(52,211,153,.15)} .kmc.dc{fill:rgba(246,182,75,.12)}
  .kmv{font-family:var(--mono); text-anchor:middle; fill:var(--muted); font-size:14px}
  .kmv.one{fill:#c6ffe6; font-weight:700} .kmv.dc{fill:var(--amber); font-weight:700}
  .kmh{font-family:var(--mono); fill:var(--faint); text-anchor:middle; font-size:10px}
  .kml{fill-opacity:.12; stroke-width:2.4; stroke-linejoin:round}      /* group loop */
  .km-cap{font-size:10.5px; color:var(--faint); margin-top:6px; line-height:1.6}
  .lg{display:inline-flex; align-items:center; gap:4px; margin:0 8px 3px 0}
  .lg i{width:12px; height:12px; border-radius:3px; border:2px solid; display:inline-block}

  /* ---------- Interactive K-Map Game ---------- */
  .kmap-game{margin-top:8px}
  .kmap-game:not(.show){display:none}
  .kmap-game-svg{width:100%;max-width:300px;height:auto;display:block;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none}
  .km-icell{fill:var(--bg3);stroke:var(--line2);stroke-width:1.5;cursor:pointer;transition:fill .12s, stroke .12s, filter .12s}
  .km-icell:hover{fill:var(--bg4);stroke:var(--line)}
  .km-icell.one{fill:rgba(52,211,153,.18)}
  .km-icell.one:hover{fill:rgba(52,211,153,.28)}
  .km-icell.dc{fill:rgba(246,182,75,.12)}
  .km-icell.dc:hover{fill:rgba(246,182,75,.22)}
  .km-icell.selected{fill:rgba(34,211,238,.28)!important;stroke:var(--cyan)!important;stroke-width:2.5!important;filter:drop-shadow(0 0 5px rgba(34,211,238,.6))}
  .km-cell-plot{cursor:pointer}
  .km-cell-plot:hover{stroke:var(--cyan)!important;stroke-width:2px;filter:drop-shadow(0 0 4px rgba(34,211,238,.45))}
  .km-midx{font-family:var(--mono);font-size:8.5px;fill:var(--faint);opacity:.65;pointer-events:none}
  .km-ival{font-family:var(--mono);text-anchor:middle;fill:var(--muted);font-size:18px;pointer-events:none}
  .km-ival.one{fill:#c6ffe6;font-weight:700}
  .km-ival.dc{fill:var(--amber);font-weight:700}
  .km-iheader{font-family:var(--mono);fill:var(--faint);text-anchor:middle;font-size:11px;pointer-events:none}
  .km-preview-rect{fill:rgba(108,140,255,.16);stroke:var(--accent);stroke-width:2.2;stroke-dasharray:5 3;rx:8;pointer-events:none}
  .km-group-rect{stroke-linejoin:round;pointer-events:none;transition:stroke-width .15s}
  .km-group:hover .km-group-rect{stroke-width:3.2!important}
  .km-group-label{font-family:var(--mono);font-size:11px;fill:#fff;text-anchor:middle;pointer-events:none;font-weight:700;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
  .km-group-del{opacity:0;transition:opacity .15s}
  .km-group:hover .km-group-del{opacity:1}
  .km-select-bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:7px;padding:6px 10px;background:rgba(34,211,238,.07);border:1px solid rgba(34,211,238,.25);border-radius:var(--radius-s);animation:fade .18s ease}
  .km-select-hint{font-size:11.5px;color:var(--muted);flex:1 1 auto}
  .km-plot-bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:7px;padding:6px 10px;background:rgba(108,140,255,.09);border:1px solid rgba(108,140,255,.3);border-radius:var(--radius-s);animation:fade .18s ease}
  .km-plot-hint{font-size:11.5px;color:var(--muted);flex:1 1 auto;line-height:1.4}
  .km-plot-err{animation:kmPlotErrBlink .7s ease 3}
  @keyframes kmPlotErrBlink{0%,100%{fill:rgba(248,113,122,.15);stroke:var(--red)}50%{fill:rgba(248,113,122,.55);stroke:var(--red);stroke-width:2.5}}
  .plot-chip{display:inline-block;padding:0 3px;border-radius:3px;transition:all .15s ease}
  .plot-chip.matched{color:var(--green);font-weight:700;background:rgba(52,211,153,.15);box-shadow:0 0 0 1px rgba(52,211,153,.3)}
  .km-game-controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
  .km-game-info{font-size:12px;color:var(--muted);margin-top:6px;min-height:18px}
  .km-result{margin-top:10px;padding:10px 12px;border-radius:var(--radius-s);display:none;animation:fade .25s ease}
  .km-result.show{display:block}
  .km-result.correct{background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.35)}
  .km-result.partial{background:rgba(246,182,75,.1);border:1px solid rgba(246,182,75,.35)}
  .km-result.wrong{background:rgba(248,113,122,.1);border:1px solid rgba(248,113,122,.35)}
  .km-result .result-text{font-size:13px;font-weight:700}
  .km-result.correct .result-text{color:var(--green)}
  .km-result.partial .result-text{color:var(--amber)}
  .km-result.wrong .result-text{color:var(--red)}
  .km-result .result-detail{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.7}
  .km-result .result-detail .chip{vertical-align:middle}
  .km-uncovered{animation:kmBlink 1s ease 3}
  @keyframes kmBlink{0%,100%{fill:rgba(248,113,122,.15)}50%{fill:rgba(248,113,122,.5)}}
  @keyframes popIn{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
  .km-group-rect.new{animation:popIn .2s ease}
  body.compact .kmap-game-svg{max-width:240px}
  body.compact .km-plot-bar{padding:5px 7px;gap:5px}
  body.compact .km-plot-hint{font-size:10.5px}
  body.compact .km-game-info{font-size:11px}
  body.compact .km-result{padding:7px;margin-top:7px}
  body.tiny .kmap-game-svg{max-width:200px}

  /* buttons row */
  .c-actions{display:grid; grid-template-columns:1fr auto auto auto; gap:8px; padding:0 13px 13px}
  .c-actions .btn{justify-content:center; width:100%; padding:9px 8px}

  /* compact mode: auto-applied when sections get short (small screen / many rows) so more fits without scroll */
  body.compact .c-head{padding:5px 11px 5px}
  body.compact .c-timer{padding:6px 11px 5px; gap:8px}
  body.compact .t-clock{font-size:20px}
  body.compact .t-track{margin:0 11px 7px}
  body.compact .c-body{padding:2px 11px 9px}
  body.compact .c-content{gap:6px}
  body.compact .prob{padding:7px 9px; font-size:13px; line-height:1.45}
  body.compact .instr{margin-top:5px; padding:4px 8px; font-size:11.5px}
  body.compact .answer{padding:8px}
  body.compact .ans-label{margin-bottom:4px; font-size:10.5px}
  body.compact .ans-eq{font-size:13.5px; line-height:1.45}
  body.compact .ans-meta{margin-top:5px; gap:6px}
  body.compact .ans-note{margin-top:2px}
  body.compact .c-actions{padding:0 11px 9px; gap:6px}
  body.compact .c-actions .btn{padding:5px 6px; font-size:12px}
  /* very short cards (tiny screens / many rows): drop the countdown bar and shrink the timer further.
     The colored instruction line is kept — it is a key method cue. */
  body.tiny .t-track{display:none}
  body.tiny .c-timer{padding:5px 11px 4px}
  body.tiny .t-clock{font-size:18px}
  body.tiny .instr{margin-top:4px; padding:3px 8px}
  body.tiny .prob{padding:6px 9px}

  /* narrow screens: shrink the toolbar so its controls don't wrap into many rows and steal card height */
  @media(max-width:1400px){
    .brand .sub{display:none}
    .logo{width:30px;height:30px;font-size:15px;border-radius:8px}
    .brand h1{font-size:15px}
    .bar-inner{padding:7px 16px;gap:6px}
    .controls{gap:6px 9px}
    .field>label{font-size:10px}
    .inp,select.inp{padding:6px 8px;font-size:13px}
    .btn{padding:6px 9px;font-size:12.5px}
  }
  /* --cols and --rows are driven responsively by updateLayout() in JS (accounts for these same breakpoints) */
  @media(max-width:720px){ .bar-inner{padding:6px 12px} main{padding:10px 12px} }

  /* ---------- Streak System ---------- */
  .streak-board{display:flex;align-items:center;gap:8px;background:rgba(28,32,48,.82);border:1px solid var(--line);padding:4px 8px;border-radius:14px;box-shadow:0 4px 16px rgba(0,0,0,.25);backdrop-filter:blur(8px)}
  .streak-card{display:flex;align-items:center;gap:6px;padding:4px 9px;background:rgba(255,255,255,.04);border:1px solid var(--line2);border-radius:10px;transition:all .25s cubic-bezier(.34,1.56,.64,1)}
  .streak-card.current{border-color:rgba(251,146,60,.3);background:rgba(251,146,60,.06)}
  .streak-card.current.active{border-color:rgba(251,146,60,.75);background:radial-gradient(ellipse at center,rgba(251,146,60,.22),rgba(234,88,12,.1));box-shadow:0 0 14px rgba(251,146,60,.4)}
  .streak-card.best{border-color:rgba(246,182,75,.3);background:rgba(246,182,75,.06)}
  .streak-card.total{border-color:rgba(52,211,153,.3);background:rgba(52,211,153,.06)}

<script>
/* ======================================================================
   Boolean minimizer — Quine–McCluskey + exact minimum cover
   (verified: 50,000 random cases vs brute-force, 0 failures)
   Convention: minterm = a*8+b*4+c*2+d  (a=MSB, d=LSB)
   Implicant {val,dash}: dash bit=1 => '-'(wildcard); val has dashed bits cleared.
   ====================================================================== */
function popcount(x){let c=0;while(x){x&=x-1;c++;}return c;}
function primeImplicants(ones){
  let current=ones.map(v=>({val:v,dash:0})); const primes={};
  while(current.length){
    const used=new Array(current.length).fill(false), next=[], seen=new Set(), byDash={};
    current.forEach((t,i)=>{(byDash[t.dash]||(byDash[t.dash]=[])).push(i);});
    for(const dash in byDash){
      const idxs=byDash[dash];
      for(let a=0;a<idxs.length;a++)for(let b=a+1;b<idxs.length;b++){
        const i=idxs[a],j=idxs[b], diff=current[i].val^current[j].val;
        if(diff&&(diff&(diff-1))===0){
          used[i]=used[j]=true;
          const nd=Number(dash)|diff, nv=current[i].val&~nd, key=nd+'|'+nv;
          if(!seen.has(key)){seen.add(key);next.push({val:nv,dash:nd});}
        }
      }
    }
    current.forEach((t,i)=>{if(!used[i])primes[t.dash+'|'+t.val]={val:t.val,dash:t.dash};});
    current=next;
  }
  /* Safety: if no primes were found but the input was non-empty, the all-dash PI covers everything */
  if(Object.keys(primes).length===0 && ones.length>0){
    /* This shouldn't happen with correct QM, but guard against it */
    console.warn('[primeImplicants] no primes found — re-deriving');
  }
  return Object.values(primes);
}
function covers(pi,m){return (m&~pi.dash)===pi.val;}
function literals(pi,varCount=4){return varCount-popcount(pi.dash);}
function minCover(pis,targets){
  if(targets.length===0)return [];
  const rel=[];
  for(let i=0;i<pis.length;i++){
    const set=targets.filter(m=>covers(pis[i],m));
    if(set.length)rel.push({pi:pis[i],mask:set.reduce((a,m)=>a|(1<<targets.indexOf(m)),0)});
  }
  const full=(1<<targets.length)-1;
  for(let k=1;k<=rel.length;k++){
    let best=null,bestLit=Infinity; const combo=new Array(k);
    const rec=(start,depth,mask,lit)=>{
      if(best&&lit>=bestLit)return;
      if(depth===k){if(mask===full&&lit<bestLit){bestLit=lit;best=combo.slice();}return;}
      for(let i=start;i<=rel.length-(k-depth);i++){combo[depth]=rel[i];rec(i+1,depth+1,mask|rel[i].mask,lit+literals(rel[i].pi));}
    };
    rec(0,0,0,0);
    if(best)return best.map(c=>c.pi);
  }
  return rel.map(r=>r.pi);
}
function minimize(minterms,dontcares,varCount=4){
  minterms=[...new Set(minterms)].sort((a,b)=>a-b);
  const ones=[...new Set([...minterms,...dontcares])];
  if(minterms.length===0)return {const:0,terms:[],varCount};
  if(ones.length===(1<<varCount))return {const:1,terms:[{val:0,dash:(1<<varCount)-1}],varCount};
  const pis=primeImplicants(ones);
  const essential=[], coveredByEss=new Set();
  for(const m of minterms){
    const c=pis.filter(p=>covers(p,m));
    if(c.length===1&&!essential.includes(c[0]))essential.push(c[0]);
  }
  for(const e of essential)for(const m of minterms)if(covers(e,m))coveredByEss.add(m);
  const remaining=minterms.filter(m=>!coveredByEss.has(m));
  const nonEss=pis.filter(p=>!essential.includes(p));
  const extra=minCover(nonEss,remaining);
  return {const:null,terms:[...essential,...extra],varCount};
}
const VARS=['a','b','c','d'];
function termParts(pi,varCount=4){const parts=[];for(let bit=varCount-1;bit>=0;bit--){if(pi.dash&(1<<bit))continue;parts.push({v:VARS[varCount-1-bit],neg:!((pi.val>>bit)&1)});}return parts;}
function termHTML(pi,varCount=4){if(pi.dash===(1<<varCount)-1)return '1';return termParts(pi,varCount).map(p=>p.neg?`<span class="ov">${p.v}</span>`:p.v).join('');}
function termPlain(pi,varCount=4){if(pi.dash===(1<<varCount)-1)return '1';return termParts(pi,varCount).map(p=>p.neg?p.v+'′':p.v).join('');}

function maxtermParts(pi,varCount=4){const parts=[];for(let bit=varCount-1;bit>=0;bit--){if(pi.dash&(1<<bit))continue;parts.push({v:VARS[varCount-1-bit],neg:Boolean((pi.val>>bit)&1)});}return parts;}
function maxtermHTML(pi,varCount=4){if(pi.dash===(1<<varCount)-1)return '0';const parts=maxtermParts(pi,varCount);const inner=parts.map(p=>p.neg?`<span class="ov">${p.v}</span>`:p.v).join('<span class="op">+</span>');return `(${inner})`;}
function maxtermPlain(pi,varCount=4){if(pi.dash===(1<<varCount)-1)return '0';const parts=maxtermParts(pi,varCount);const inner=parts.map(p=>p.neg?p.v+'′':p.v).join('+');return `(${inner})`;}

function singleTermHTML(pi,varCount=4,mode='sop'){return mode==='pos'?maxtermHTML(pi,varCount):termHTML(pi,varCount);}
function singleTermPlain(pi,varCount=4,mode='sop'){return mode==='pos'?maxtermPlain(pi,varCount):termPlain(pi,varCount);}

function sortedTerms(res){const n=res.varCount||4;return [...res.terms].sort((x,y)=>literals(y,n)-literals(x,n)||x.val-y.val||x.dash-y.dash);}
// each product/sum term gets a color, shared between the equation and its K-map loop
const KM_PALETTE=['#38bdf8','#f472b6','#a3e635','#fb923c','#c084fc','#f2c14e'];
function termsWithColor(res){return sortedTerms(res).map((t,i)=>({t,color:KM_PALETTE[i%KM_PALETTE.length]}));}

function exprHTML(res,mode='sop'){
  /* For POS: minimize was called on maxterms → const:0 means "no 0-cells" → f=1;
     const:1 means "all cells are 0 or dc" → f=0. Invert display for POS. */
  if(res.const===0) return mode==='pos'?'1':'0';
  if(res.const===1) return mode==='pos'?'0':'1';
  if(mode==='pos'){
    return termsWithColor(res).map(({t,color})=>`<span class="term" style="color:${color}">${maxtermHTML(t,res.varCount)}</span>`).join('<span class="op">·</span>');
  }
  return termsWithColor(res).map(({t,color})=>`<span class="term" style="color:${color}">${termHTML(t,res.varCount)}</span>`).join('<span class="op">+</span>');
}
function exprPlain(res,mode='sop'){
  if(res.const===0) return mode==='pos'?'1':'0';
  if(res.const===1) return mode==='pos'?'0':'1';
  if(mode==='pos') return sortedTerms(res).map(t=>maxtermPlain(t,res.varCount)).join(' · ');
  return sortedTerms(res).map(t=>termPlain(t,res.varCount)).join(' + ');
}
function sopHTML(res){return exprHTML(res,'sop');}
function sopPlain(res){return exprPlain(res,'sop');}

/* ======================================================================
   App / UI
   ====================================================================== */
const $=s=>document.getElementById(s);
const grid=$('grid');
const cfg={count:$('cfgCount'),cols:$('cfgCols'),tmode:$('cfgTimerMode'),
  minK:$('cfgMinK'),secK:$('cfgSecK'), vars:$('cfgVars'), logicMode:$('cfgLogicMode'),
  plotMode:$('cfgPlotMode'), playMode:$('cfgPlayMode'), difficulty:$('cfgDifficulty')};
const state={sections:[],nextId:1,pausedAll:false};

/* ======================================================================
   Streak System
   ====================================================================== */
const STREAK_KEY = 'kmap_streak_stats_v1';
let streakStats = { current: 0, best: 0, total: 0 };
try {
  const saved = localStorage.getItem(STREAK_KEY);
  if(saved) streakStats = Object.assign(streakStats, JSON.parse(saved));
} catch(e){}

let toastTid = null;
function showStreakToast(msg){
  const el = $('streakToast');
  if(!el) return;
  el.innerHTML = msg;
  el.classList.add('show');
  clearTimeout(toastTid);
  toastTid = setTimeout(()=>{ el.classList.remove('show'); }, 2600);
}

function saveStreakStats(){
  try {
    localStorage.setItem(STREAK_KEY, JSON.stringify(streakStats));
  } catch(e){}
}

function updateStreakUI(milestoneText){
  const sv = $('streakVal'), bv = $('bestStreakVal'), tv = $('totalSolvedVal');
  const cardCur = $('streakCardCurrent');
  if(sv) sv.textContent = streakStats.current;
  if(bv) bv.textContent = streakStats.best;
  if(tv) tv.textContent = streakStats.total;
  if(cardCur) cardCur.classList.toggle('active', streakStats.current > 0);
  saveStreakStats();
  if(milestoneText) showStreakToast(milestoneText);
}

function onProblemSolved(sec){
  streakStats.current++;
  streakStats.total++;
  let isNewBest = false;
  if(streakStats.current > streakStats.best){
    streakStats.best = streakStats.current;
    isNewBest = true;
  }
  let milestone = null;
  if(streakStats.current === 3) milestone = '🔥 Streak x3! เครื่องกำลังร้อน!';
  else if(streakStats.current === 5) milestone = '🔥 Streak x5! ยอดเยี่ยมมาก!';
  else if(streakStats.current === 10) milestone = '⚡ Streak x10! เซียน K-Map ตัวจริง!';
  else if(streakStats.current === 20) milestone = '👑 Streak x20! เทพ K-Map ไร้เทียมทาน!';
  else if(streakStats.current % 10 === 0) milestone = `🔥 Streak x${streakStats.current}! สุดยอดมาก!`;
  else if(isNewBest && streakStats.current > 3) milestone = `🏆 New Best Streak! ทะลุสถิติใหม่ ${streakStats.current} ข้อ!`;

  updateStreakUI(milestone);
}

function onStreakBreak(reason){
  if(streakStats.current > 0){
    const prev = streakStats.current;
    streakStats.current = 0;
    updateStreakUI();
    if(prev >= 3){
      showStreakToast(`💔 Streak หลุดที่ ${prev} ข้อ! สู้ใหม่อีกครั้ง!`);
    }
  }
}

function targetMs(){
  return ((+cfg.minK.value||0)*60+(+cfg.secK.value||0))*1000;
}
function fmt(ms){ms=Math.max(0,ms);const t=Math.floor(ms/1000);return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');}
function randInt(n){return Math.floor(Math.random()*n);}
function sample(pool,k){const p=[...pool],out=[];for(let i=0;i<k&&p.length;i++)out.push(p.splice(randInt(p.length),1)[0]);return out;}
function selectedVarCount(){return +cfg.vars.value;}

function genProblem(){
  const varCount=selectedVarCount(), all=[...Array(1<<varCount).keys()];
  const ratios={easy:[1,2,0,1],medium:[2,Math.max(3,Math.ceil(all.length*.48)),1,Math.max(2,Math.ceil(all.length*.28))],hard:[Math.max(2,Math.ceil(all.length*.35)),Math.max(3,Math.ceil(all.length*.7)),Math.max(1,Math.ceil(all.length*.18)),Math.max(2,Math.ceil(all.length*.38))]};
  const r=ratios[cfg.difficulty.value]||ratios.medium;
  const activeCount=Math.min(all.length-1,r[0]+randInt(Math.max(1,r[1]-r[0]+1)));
  const actives=sample(all,activeCount).sort((a,b)=>a-b);
  const rest=all.filter(x=>!actives.includes(x));
  const dcCount=Math.min(rest.length,r[2]+randInt(Math.max(1,r[3]-r[2]+1)));
  const dontcares=sample(rest,dcCount).sort((a,b)=>a-b);

  const chosenMode = (cfg.logicMode && cfg.logicMode.value) ? cfg.logicMode.value : 'sop';
  const mode = chosenMode === 'random' ? (Math.random() < 0.5 ? 'sop' : 'pos') : chosenMode;
  let minterms, maxterms;
  if(mode==='pos'){
    maxterms = actives;
    minterms = all.filter(x=>!maxterms.includes(x)&&!dontcares.includes(x));
  } else {
    minterms = actives;
    maxterms = all.filter(x=>!minterms.includes(x)&&!dontcares.includes(x));
  }

  const result = minimize(actives, dontcares, varCount);
  return {
    mode,
    actives,
    minterms,
    maxterms,
    dontcares,
    method:'kmap',
    varCount,
    result
  };
}

function newTimer(mode){return {mode,running:false,anchor:0,base:0,start:0,pausedByGlobal:false};}
function tVal(t,now){return t.mode==='down' ? t.base-(t.running?now-t.anchor:0) : t.base+(t.running?now-t.anchor:0);}
function tFreeze(t,now){t.base=tVal(t,now);t.running=false;}
function tRun(t,now){t.anchor=now;t.running=true;}

function doGenerate(sec){
  sec.problem=genProblem();
  sec.streakRewarded=false;
  sec.timer=newTimer(cfg.tmode.value);
  sec.timer.base=sec.timer.mode==='down'?targetMs():0;
  sec.timer.startBase=sec.timer.base;
  tRun(sec.timer,performance.now());
  sec.phase='running';
  renderProblem(sec);
  sec.ref.answer.classList.remove('show');
  sec.ref.kmap.classList.remove('show'); sec.ref.kmtoggle.textContent='▸ แสดง K-map';
  sec.ref.reveal.disabled=false;

  sec.ref.usedwrap.style.display='none';
  sec.ref.result.className='km-result'; sec.ref.result.innerHTML='';
  setupGameUI(sec,true);
  updateCard(sec,performance.now());
}
function doReveal(sec){
  if(!sec.problem)return;
  const now=performance.now();
  if(sec.timer.running)tFreeze(sec.timer,now);
  sec.phase='revealed';
  const res=sec.problem.result;
  const isPos=sec.problem.mode==='pos';
  // If user has drawn groups in K-Map game, evaluate them before revealing
  if(sec.game&&sec.game.groups.length>0){
    const {varCount}=sec.problem;
    const targetActives = isPos ? sec.problem.maxterms : sec.problem.minterms;
    const targetForbidden = isPos ? sec.problem.minterms : sec.problem.maxterms;
    const forbiddenSet = new Set(targetForbidden);
    const actSet = new Set(targetActives);

    let hasInvalid=false;
    for(const g of sec.game.groups){
      for(const idx of g.cells){
        if(forbiddenSet.has(idx)){hasInvalid=true;break;}
      }
      if(hasInvalid) break;
    }
    const covered=new Set();
    for(const g of sec.game.groups) for(const idx of g.cells){
      if(actSet.has(idx))covered.add(idx);
    }
    const uncov=targetActives.filter(m=>!covered.has(m));
    const userPIs=sec.game.groups.map(g=>g.pi);
    const userLits=userPIs.reduce((a,pi)=>a+literals(pi,varCount),0),userN=userPIs.length;
    const optLits=res.const!=null?0:res.terms.reduce((a,t)=>a+literals(t,varCount),0);
    const optN=res.const!=null?(res.const?1:0):res.terms.length;
    const isOpt=!hasInvalid&&uncov.length===0&&userN<=optN&&userLits<=optLits;
    const timeUsed=sec.timer.mode==='down'?fmt(sec.timer.startBase-tVal(sec.timer,now)):fmt(tVal(sec.timer,now));
    const userExpr=userPIs.map((pi,i)=>`<span style="color:${sec.game.groups[i].color}">${singleTermHTML(pi,varCount,sec.problem.mode)}</span>`).join(isPos?'<span class="op">·</span>':'<span class="op">+</span>');
    let msg,detail;
    if(hasInvalid){
      if(!sec.streakRewarded) onStreakBreak('reveal');
      msg=isPos?'❌ ไม่ถูกต้อง — มีกลุ่มที่ครอบคลุม cell ที่เป็น 1':'❌ ไม่ถูกต้อง — มีกลุ่มที่ครอบคลุม cell ที่เป็น 0';
      detail=`คำตอบของคุณ: f = ${userExpr}<br><span class="chip time">ใช้เวลา ${timeUsed}</span>`;
      showCheckResult(sec,'wrong',msg,detail);
    }else if(uncov.length>0){
      if(!sec.streakRewarded) onStreakBreak('reveal');
      msg=`⚠️ ไม่ถูกต้อง — ยังไม่ครบ (ขาดอีก ${uncov.length} ${isPos?'maxterm (0)':'minterm (1)'})`;
      detail=`คำตอบของคุณ: f = ${userExpr} (${userN} พจน์, ${userLits} lit)<br><span class="chip time">ใช้เวลา ${timeUsed}</span>`;
      showCheckResult(sec,'partial',msg,detail);
    }else if(isOpt){
      const isFirst = !sec.streakRewarded;
      if(isFirst){
        sec.streakRewarded = true;
        onProblemSolved(sec);
      }
      msg=`🎉 ถูกต้อง 100%! ลดรูปสั้นที่สุด (Optimal Minimal ${isPos?'POS':'SOP'})`;
      detail=`f = ${userExpr}<br><span class="chip time">ใช้เวลา ${timeUsed}</span> · <span class="chip">${userN} พจน์</span> · <span class="chip">${userLits} literal</span>`+
        (isFirst ? ` · <span class="chip" style="background:rgba(251,146,60,.18);color:#fdba74;border:1px solid rgba(251,146,60,.4)">🔥 Streak ${streakStats.current}</span>` : '');
      showCheckResult(sec,'correct',msg,detail);
    }else{
      if(!sec.streakRewarded) onStreakBreak('reveal');
      msg='⚠️ ยังไม่ถูกต้อง — ยังลดรูปไม่สั้นที่สุด!';
      detail=`คำตอบของคุณ: f = ${userExpr} (<b>${userN}</b> พจน์, <b>${userLits}</b> literal)<br>เฉลยที่สั้นที่สุด: f = ${exprHTML(res,sec.problem.mode)} (<b>${optN}</b> พจน์, <b>${optLits}</b> literal)<br><span class="chip time">ใช้เวลา ${timeUsed}</span>`;
      showCheckResult(sec,'partial',msg,detail);
    }
  } else {
    if(!sec.streakRewarded) onStreakBreak('reveal');
  }
  revealSolutionBox(sec);
  updateCard(sec,now);
}

/* ---- K-map with grouping loops (rows ab, cols cd, Gray order) ---- */
const KM_GRAY=[0,1,3,2];
// row/col positions (0..3, in Gray order) that a prime implicant covers
function kmPositions(pi,isRow){
  const fixed=(~pi.dash)&(isRow?0b1100:0b0011), target=pi.val&fixed, P=[];
  for(let pos=0;pos<4;pos++){ const v=KM_GRAY[pos], bits=isRow?(v<<2):v; if((bits&fixed)===target)P.push(pos); }
  return P;
}
// contiguous span(s); {0,3} means the group wraps the outer edges → two pieces
function kmSpans(P){
  const a=[...P].sort((x,y)=>x-y);
  if(a.length===2&&a[0]===0&&a[1]===3)return [[0,0],[3,3]];
  return [[a[0],a[a.length-1]]];
}
function buildKmapSVG(p,res){
  const vc = p.varCount;
  const isPos = p.mode === 'pos';
  const gi = kmGI(vc);
  const on = new Set(p.minterms), dc = new Set(p.dontcares);
  const M = 4, hw = 30, hh = 20, cw = 44, ch = 34;
  const x0 = M + hw, y0 = M + hh, W = x0 + gi.cols * cw + M, H = y0 + gi.rows * ch + M;
  let s = `<svg viewBox="0 0 ${W} ${H}" class="kmsvg" xmlns="http://www.w3.org/2000/svg">`;
  s += `<text x="${M+hw-4}" y="${M+hh-5}" class="kmh" text-anchor="end" style="font-size:8.5px">${gi.rl}\\${gi.cl}</text>`;
  for(let c=0; c<gi.cols; c++) s += `<text x="${x0+c*cw+cw/2}" y="${M+hh-5}" class="kmh">${gi.cls[c]}</text>`;
  for(let r=0; r<gi.rows; r++) s += `<text x="${M+hw-5}" y="${y0+r*ch+ch/2+4}" class="kmh" text-anchor="end">${gi.rls[r]}</text>`;
  
  for(let r=0; r<gi.rows; r++){
    for(let c=0; c<gi.cols; c++){
      const idx = grayIndex(r, c, vc);
      const isOn = on.has(idx), isDc = dc.has(idx);
      let cls = '', val = '0';
      if(isPos){
        const isZero = !isOn && !isDc;
        cls = isZero ? 'zero' : isDc ? 'dc' : '';
        val = isZero ? '0' : isDc ? 'x' : '1';
      } else {
        cls = isOn ? 'one' : isDc ? 'dc' : '';
        val = isOn ? '1' : isDc ? 'x' : '0';
      }
      const x = x0 + c * cw, y = y0 + r * ch;
      s += `<rect x="${x}" y="${y}" width="${cw}" height="${ch}" class="kmc ${cls}"/>`;
      s += `<text x="${x+cw/2}" y="${y+ch/2+5}" class="kmv ${cls}">${val}</text>`;
    }
  }

  // Draw loops for terms
  termsWithColor(res).forEach(({t, color}, i) => {
    const coveredCells = [];
    const total = 1 << vc;
    for(let idx=0; idx<total; idx++){
      if(covers(t, idx)) coveredCells.push(idx);
    }
    const valGrp = validateCellGroup(coveredCells, vc);
    if(valGrp){
      const rs = kmSpans(valGrp.rows), cs = kmSpans(valGrp.cols);
      const inset = 3 + Math.min(i, 3) * 2.2;
      for(const [r0, r1] of rs){
        for(const [c0, c1] of cs){
          const x = x0 + c0 * cw + inset, y = y0 + r0 * ch + inset;
          const w = (c1 - c0 + 1) * cw - 2 * inset, h = (r1 - r0 + 1) * ch - 2 * inset;
          s += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="8" class="kml" style="stroke:${color};fill:${color}"/>`;
        }
      }
    }
  });

  s += `</svg>`;
  const cap = isPos
    ? `0 = maxterm · x = don't-care · 1 = หนึ่ง · <b style="color:var(--muted)">วงสี = กลุ่มของแต่ละพจน์บวก (สีตรงกับพจน์ในสมการ)</b>`
    : `1 = minterm · x = don't-care · 0 = ศูนย์ · <b style="color:var(--muted)">วงสี = กลุ่มของแต่ละพจน์คูณ (สีตรงกับพจน์ในสมการ)</b>`;
  return s + `<div class="km-cap">${cap}</div>`;
}

/* ======================================================================
   Interactive K-Map Game — วาดวงกลุ่มบน K-Map (รองรับวงข้ามขอบ / Wrap-around)
   ====================================================================== */
const KM_GRAY2=[0,1];
function grayIndex(r,c,vc){
  if(vc===4) return KM_GRAY[r]*4+KM_GRAY[c];
  if(vc===3) return (r<<2)|KM_GRAY[c];
  return r*2+c;
}
function kmGI(vc){
  if(vc===4) return {rows:4,cols:4,rl:'ab',cl:'cd',rls:['00','01','11','10'],cls:['00','01','11','10']};
  if(vc===3) return {rows:2,cols:4,rl:'a',cl:'bc',rls:['0','1'],cls:['00','01','11','10']};
  return {rows:2,cols:2,rl:'a',cl:'b',rls:['0','1'],cls:['0','1']};
}

function cellsToPI(cells, vc){
  if(!cells||!cells.length) return {val:0,dash:0};
  let dash=0, val=cells[0];
  for(const m of cells) dash|=(val^m);
  val&=~dash;
  return {val,dash};
}

function validateCellGroup(cellArray, vc){
  if(!cellArray||!cellArray.length) return null;
  const n=cellArray.length;
  if((n&(n-1))!==0) return null;
  const gi=kmGI(vc);
  const cellSet=new Set(cellArray);
  const rowSet=new Set(), colSet=new Set();

  for(let r=0;r<gi.rows;r++){
    for(let c=0;c<gi.cols;c++){
      if(cellSet.has(grayIndex(r,c,vc))){
        rowSet.add(r);
        colSet.add(c);
      }
    }
  }
  const rows=[...rowSet].sort((a,b)=>a-b);
  const cols=[...colSet].sort((a,b)=>a-b);

  if(rows.length*cols.length!==n) return null;
  for(const r of rows) for(const c of cols){
    if(!cellSet.has(grayIndex(r,c,vc))) return null;
  }

  function isValid1D(arr, max){
    const len=arr.length;
    if(len===1) return true;
    if(len===max) return true;
    if(len===2&&max===4){
      if((arr[0]===0&&arr[1]===1)||(arr[0]===1&&arr[1]===2)||(arr[0]===2&&arr[1]===3)||(arr[0]===0&&arr[1]===3)) return true;
      return false;
    }
    return false;
  }
  if(!isValid1D(rows, gi.rows)) return null;
  if(!isValid1D(cols, gi.cols)) return null;

  const pi=cellsToPI(cellArray, vc);
  for(let m=0;m<(1<<vc);m++){
    if(covers(pi, m)!==cellSet.has(m)) return null;
  }

  const isWrapRow=rows.length===2&&rows[0]===0&&rows[1]===3;
  const isWrapCol=cols.length===2&&cols[0]===0&&cols[1]===3;
  let wrapType='normal';
  if(isWrapRow&&isWrapCol) wrapType='corner';
  else if(isWrapRow) wrapType='wrap-row';
  else if(isWrapCol) wrapType='wrap-col';

  return {rows, cols, cells:cellArray, pi, wrapType};
}

function buildGameKmap(prob, sec){
  const {minterms,dontcares,varCount,mode}=prob;
  const isPos = mode === 'pos';
  const isPlotting = sec && sec.plotState === 'plotting';
  const gi=kmGI(varCount),on=new Set(minterms),dc=new Set(dontcares);
  const M=4,hw=35,hh=24,cw=56,ch=50;
  const x0=M+hw,y0=M+hh,W=x0+gi.cols*cw+M,H=y0+gi.rows*ch+M;
  let s=`<svg viewBox="0 0 ${W} ${H}" class="kmap-game-svg" xmlns="http://www.w3.org/2000/svg">`;
  s+=`<text x="${M+hw-4}" y="${M+hh-6}" class="km-iheader" text-anchor="end" style="font-size:9px">${gi.rl}\\${gi.cl}</text>`;
  for(let c=0;c<gi.cols;c++) s+=`<text x="${x0+c*cw+cw/2}" y="${M+hh-6}" class="km-iheader">${gi.cls[c]}</text>`;
  for(let r=0;r<gi.rows;r++){
    s+=`<text x="${M+hw-6}" y="${y0+r*ch+ch/2+5}" class="km-iheader" text-anchor="end">${gi.rls[r]}</text>`;
    for(let c=0;c<gi.cols;c++){
      const idx=grayIndex(r,c,varCount);
      let cls='', val='0';
      if(isPlotting){
        val = (sec.userCells && sec.userCells.get(idx)) || (isPos ? '1' : '0');
        cls = (val==='1'?'one':val==='x'?'dc':isPos?'zero':'') + ' km-cell-plot';
      } else {
        const isOn=on.has(idx), isDc=dc.has(idx);
        if(isPos){
          const isZero = !isOn && !isDc;
          cls = isZero ? 'zero' : isDc ? 'dc' : '';
          val = isZero ? '0' : isDc ? 'x' : '1';
        } else {
          cls = isOn ? 'one' : isDc ? 'dc' : '';
          val = isOn ? '1' : isDc ? 'x' : '0';
        }
      }
      s+=`<rect x="${x0+c*cw}" y="${y0+r*ch}" width="${cw}" height="${ch}" class="km-icell ${cls}" data-r="${r}" data-c="${c}" data-idx="${idx}"/>`;
      s+=`<text x="${x0+c*cw+4}" y="${y0+r*ch+10}" class="km-midx">${isPos?'M':'m'}${idx}</text>`;
      s+=`<text x="${x0+c*cw+cw/2}" y="${y0+r*ch+ch/2+7}" class="km-ival ${cls}">${val}</text>`;
    }
  }
  s+=`<g class="km-preview-layer"></g><g class="km-groups-layer"></g></svg>`;
  const footHint = isPlotting
    ? `💡 <b>โหมดลงตาราง:</b> คลิกช่องเพื่อใส่ ${isPos?'0 หรือ x':'1 หรือ x'} จากโจทย์ แล้วกด "✓ ตรวจการลงตาราง"`
    : `💡 ลากหรือคลิกช่องเพื่อวงกลุ่ม ${isPos?'<b>0</b>':'<b>1</b>'} · <b>คลิกช่องขอบตรงข้ามเพื่อวงข้าม</b>`;
  s+=`<div style="text-align:center;margin-top:5px;font-size:11px;color:var(--faint)">${footHint}</div>`;
  return {html:s,x0,y0,cw,ch,gi};
}

function initGameState(sec){
  sec.game={groups:[],selectedCells:new Set(),gridInfo:kmGI(sec.problem.varCount),x0:0,y0:0,cw:0,ch:0,feedbackTid:null};
}

function renderGameGroups(sec){
  const svg=sec.el.querySelector('.kmap-game-svg'); if(!svg) return;
  const layer=svg.querySelector('.km-groups-layer'),{x0,y0,cw,ch}=sec.game;
  layer.innerHTML='';
  sec.game.groups.forEach((g,i)=>{
    const ins=3+Math.min(i,4)*2.2;
    const rs=kmSpans(g.rows), cs=kmSpans(g.cols);
    const grp=document.createElementNS('http://www.w3.org/2000/svg','g');
    grp.classList.add('km-group');

    for(const [r0,r1] of rs){
      for(const [c0,c1] of cs){
        const gx=x0+c0*cw+ins, gy=y0+r0*ch+ins;
        const gw=(c1-c0+1)*cw-2*ins, gh=(r1-r0+1)*ch-2*ins;
        const rect=document.createElementNS('http://www.w3.org/2000/svg','rect');
        ['x','y','width','height','rx'].forEach((k,ki)=>rect.setAttribute(k,[gx,gy,gw,gh,8][ki]));
        rect.style.cssText=`fill:${g.color};fill-opacity:.16;stroke:${g.color};stroke-width:2.5`;
        rect.classList.add('km-group-rect','new');
        grp.appendChild(rect);
      }
    }

    const pR=rs[0], pC=cs[0];
    const px=x0+pC[0]*cw+ins, py=y0+pR[0]*ch+ins;
    const pw=(pC[1]-pC[0]+1)*cw-2*ins, ph=(pR[1]-pR[0]+1)*ch-2*ins;

    const lbl=document.createElementNS('http://www.w3.org/2000/svg','text');
    lbl.setAttribute('x',px+pw/2); lbl.setAttribute('y',py+ph/2+4);
    lbl.classList.add('km-group-label');
    lbl.textContent=singleTermPlain(g.pi,sec.problem.varCount,sec.problem.mode);
    grp.appendChild(lbl);

    const dx=px+pw-2, dy=py+8;
    const delC=document.createElementNS('http://www.w3.org/2000/svg','circle');
    delC.setAttribute('cx',dx); delC.setAttribute('cy',dy); delC.setAttribute('r','9');
    delC.style.cssText=`fill:rgba(0,0,0,.75);stroke:${g.color};stroke-width:1.6;cursor:pointer`;
    delC.classList.add('km-group-del');

    const delT=document.createElementNS('http://www.w3.org/2000/svg','text');
    delT.setAttribute('x',dx); delT.setAttribute('y',dy+4); delT.setAttribute('text-anchor','middle');
    delT.style.cssText='fill:#fff;font-size:13px;font-weight:bold;pointer-events:none';
    delT.classList.add('km-group-del'); delT.textContent='×';

    delC.addEventListener('click',e=>{
      e.stopPropagation();
      sec.game.groups.splice(i,1);
      renderGameGroups(sec);
      updateGameInfo(sec);
      syncGameBtns(sec);
    });

    grp.appendChild(delC); grp.appendChild(delT);
    layer.appendChild(grp);
  });
  setTimeout(()=>layer.querySelectorAll('.new').forEach(el=>el.classList.remove('new')),250);
}

function syncGameBtns(sec){
  const n=sec.game?sec.game.groups.length:0;
  sec.ref.undo.disabled=n===0;
  sec.ref.cleargroups.disabled=n===0;
}

function updateGameInfo(sec){
  const el=sec.ref.gameinfo; if(!el) return;
  const n=sec.game?sec.game.groups.length:0;
  if(n===0){el.innerHTML='<span style="color:var(--faint)">คลิกช่อง หรือลากบน K-Map เพื่อวงกลุ่ม</span>';return;}
  const lits=sec.game.groups.reduce((a,g)=>a+literals(g.pi,sec.problem.varCount),0);
  el.innerHTML=`<b>${n}</b> กลุ่ม · <b>${lits}</b> literal`;
}

function showGameMsg(sec,msg,type){
  const el=sec.ref.gameinfo; if(!el) return;
  el.innerHTML=`<span style="color:var(--${type==='wrong'?'red':type==='info'?'cyan':'green'})">${msg}</span>`;
  clearTimeout(sec.game.feedbackTid);
  sec.game.feedbackTid=setTimeout(()=>updateGameInfo(sec),2500);
}

function updateSelectionUI(sec){
  if(!sec.game) return;
  const svg=sec.el.querySelector('.kmap-game-svg');
  if(svg){
    svg.querySelectorAll('.km-icell').forEach(c=>{
      const idx=+c.dataset.idx;
      c.classList.toggle('selected', sec.game.selectedCells.has(idx));
    });
  }
  const bar=sec.ref.selectbar, btn=sec.ref.addgroup, hint=sec.ref.selecthint;
  if(!bar) return;
  const count=sec.game.selectedCells.size;
  if(count===0){
    bar.style.display='none';
    return;
  }
  bar.style.display='flex';
  const {varCount}=sec.problem;
  const isPos=sec.problem.mode==='pos';
  const targetForbidden=isPos?sec.problem.minterms:sec.problem.maxterms;
  const forbiddenSet=new Set(targetForbidden);
  const validDef=validateCellGroup([...sec.game.selectedCells], varCount);

  if(!validDef){
    btn.disabled=true;
    btn.textContent='＋ วงกลุ่มนี้';
    hint.innerHTML=`เลือกแล้ว ${count} ช่อง (ต้องเป็นกลุ่มขนาด 1, 2, 4, 8)`;
    return;
  }
  let coversForbidden=false;
  for(const idx of validDef.cells){
    if(forbiddenSet.has(idx)){coversForbidden=true;break;}
  }
  if(coversForbidden){
    btn.disabled=true;
    btn.textContent='＋ วงกลุ่มนี้';
    hint.innerHTML=`<span style="color:var(--red)">⚠️ มีช่องที่เป็น ${isPos?'1':'0'} — ห้ามวงรวม</span>`;
    return;
  }
  btn.disabled=false;
  const wrapTag=validDef.wrapType==='corner'?' ⛶ วง 4 มุม':
                validDef.wrapType==='wrap-col'?' ↔ วงข้ามซ้าย-ขวา':
                validDef.wrapType==='wrap-row'?' ↕ วงข้ามบน-ล่าง':'';
  const termName=singleTermPlain(validDef.pi, varCount, sec.problem.mode);
  btn.innerHTML=`＋ วงกลุ่มนี้ (${count} ช่อง · ${termName})${wrapTag}`;
  hint.innerHTML='<span style="color:var(--green)">✓ รูปแบบถูกต้อง! กดปุ่มหรือกด Enter</span>';
}

function clearSelection(sec){
  if(sec.game){
    sec.game.selectedCells.clear();
    updateSelectionUI(sec);
  }
}

function addGroupDef(sec, groupDef){
  const isPos=sec.problem.mode==='pos';
  const targetForbidden=isPos?sec.problem.minterms:sec.problem.maxterms;
  const forbiddenSet=new Set(targetForbidden);
  for(const idx of groupDef.cells){
    if(forbiddenSet.has(idx)){
      showGameMsg(sec,`กลุ่มนี้ครอบคลุม ${isPos?'1':'0'} — ลองใหม่!`,'wrong');
      return false;
    }
  }
  const cellKey=[...groupDef.cells].sort((a,b)=>a-b).join(',');
  if(sec.game.groups.some(g=>[...g.cells].sort((a,b)=>a-b).join(',')===cellKey)){
    showGameMsg(sec,'กลุ่มนี้วงไปแล้ว!','info');
    return false;
  }
  groupDef.color=KM_PALETTE[sec.game.groups.length%KM_PALETTE.length];
  sec.game.groups.push(groupDef);
  renderGameGroups(sec);
  const wrapMsg=groupDef.wrapType==='corner'?' (วง 4 มุม)':
                groupDef.wrapType==='wrap-col'?' (วงข้ามซ้าย-ขวา)':
                groupDef.wrapType==='wrap-row'?' (วงข้ามบน-ล่าง)':'';
  showGameMsg(sec,`เพิ่มกลุ่มที่ ${sec.game.groups.length}${wrapMsg} ✓`,'green');
  updateGameInfo(sec);
  syncGameBtns(sec);
  return true;
}

function confirmSelectionGroup(sec){
  if(!sec.game||sec.game.selectedCells.size===0) return;
  const validDef=validateCellGroup([...sec.game.selectedCells], sec.problem.varCount);
  if(validDef){
    if(addGroupDef(sec, validDef)){
      clearSelection(sec);
    }
  }
}

function initGameInteraction(sec){
  const svg=sec.el.querySelector('.kmap-game-svg'); if(!svg) return;
  const {x0,y0,cw,ch,gridInfo:gi}=sec.game;
  const prevLayer=svg.querySelector('.km-preview-layer');
  let sR=-1, sC=-1, startX=0, startY=0, isDragging=false, moved=false;

  function evtXY(e){
    const b=svg.getBoundingClientRect(), vb=svg.viewBox.baseVal;
    const sx=vb.width/b.width, sy=vb.height/b.height;
    let cx, cy;
    if(e.changedTouches&&e.changedTouches.length){cx=e.changedTouches[0].clientX; cy=e.changedTouches[0].clientY;}
    else if(e.touches&&e.touches.length){cx=e.touches[0].clientX; cy=e.touches[0].clientY;}
    else{cx=e.clientX; cy=e.clientY;}
    return {x:(cx-b.left)*sx, y:(cy-b.top)*sy};
  }

  function cellAtXY(x,y){
    const c=Math.floor((x-x0)/cw), r=Math.floor((y-y0)/ch);
    return {r, c, inside: r>=0&&r<gi.rows&&c>=0&&c<gi.cols};
  }

  function snap(s,e,max){
    let sz=Math.abs(e-s)+1, p=1;
    while(p<sz) p*=2;
    p=Math.min(p,max);
    let a=Math.min(s,e), b=a+p-1;
    if(b>=max){ b=max-1; a=b-p+1; }
    return [Math.max(0,a),b];
  }

  function resolveDragGroup(r0,c0,r1,c1,rawX,rawY){
    let cols;
    if(gi.cols===4&&((c0===3&&rawX>x0+gi.cols*cw)||(c0===0&&rawX<x0)||(c0===3&&c1===0)||(c0===0&&c1===3))){
      cols=[0,3];
    } else {
      const [sc,ec]=snap(c0,Math.max(0,Math.min(gi.cols-1,c1)),gi.cols);
      cols=[...Array(ec-sc+1).keys()].map(i=>i+sc);
    }

    let rows;
    if(gi.rows===4&&((r0===3&&rawY>y0+gi.rows*ch)||(r0===0&&rawY<y0)||(r0===3&&r1===0)||(r0===0&&r1===3))){
      rows=[0,3];
    } else {
      const [sr,er]=snap(r0,Math.max(0,Math.min(gi.rows-1,r1)),gi.rows);
      rows=[...Array(er-sr+1).keys()].map(i=>i+sr);
    }

    const cells=[];
    for(const r of rows) for(const c of cols) cells.push(grayIndex(r,c,sec.problem.varCount));
    return validateCellGroup(cells, sec.problem.varCount);
  }

  function renderPreview(groupDef){
    if(!prevLayer) return;
    prevLayer.innerHTML='';
    if(!groupDef) return;
    const rs=kmSpans(groupDef.rows), cs=kmSpans(groupDef.cols);
    for(const [r0,r1] of rs) for(const [c0,c1] of cs){
      const rx=x0+c0*cw+2, ry=y0+r0*ch+2;
      const rw=(c1-c0+1)*cw-4, rh=(r1-r0+1)*ch-4;
      const rect=document.createElementNS('http://www.w3.org/2000/svg','rect');
      ['x','y','width','height'].forEach((k,ki)=>rect.setAttribute(k,[rx,ry,rw,rh][ki]));
      rect.classList.add('km-preview-rect');
      prevLayer.appendChild(rect);
    }
  }

  function onDown(e){
    if(sec.phase!=='running') return;
    const {x,y}=evtXY(e);
    const cell=cellAtXY(x,y);
    if(!cell.inside) return;
    isDragging=true; moved=false;
    sR=cell.r; sC=cell.c;
    startX=x; startY=y;
    e.preventDefault();
  }

  function onMove(e){
    if(!isDragging) return;
    const {x,y}=evtXY(e);
    if(!moved&&Math.hypot(x-startX,y-startY)>6){
      moved=true;
    }
    if(moved){
      const cell=cellAtXY(x,y);
      const gDef=resolveDragGroup(sR,sC,cell.r,cell.c,x,y);
      renderPreview(gDef);
    }
    e.preventDefault();
  }

  function onUp(e){
    if(!isDragging) return;
    isDragging=false;
    if(prevLayer) prevLayer.innerHTML='';
    const {x,y}=evtXY(e);

    if(!moved){
      const cell=cellAtXY(x,y);
      if(cell.inside){
        const idx=grayIndex(cell.r,cell.c,sec.problem.varCount);
        if(sec.game.selectedCells.has(idx)){
          sec.game.selectedCells.delete(idx);
        } else {
          sec.game.selectedCells.add(idx);
        }
        updateSelectionUI(sec);
      }
    } else {
      const cell=cellAtXY(x,y);
      const gDef=resolveDragGroup(sR,sC,cell.r,cell.c,x,y);
      if(gDef){
        addGroupDef(sec, gDef);
        clearSelection(sec);
      }
    }
  }

  function onCancel(){
    isDragging=false; moved=false;
    if(prevLayer) prevLayer.innerHTML='';
  }

  svg.addEventListener('mousedown',e=>{
    if(sec.plotState==='plotting'){
      handleCellPlotClick(e);
    } else {
      onDown(e);
    }
  });
  window.addEventListener('mousemove',e=>{
    if(sec.plotState!=='plotting') onMove(e);
  });
  window.addEventListener('mouseup',e=>{
    if(sec.plotState!=='plotting') onUp(e);
  });
  svg.addEventListener('mouseleave',e=>{
    if(sec.plotState!=='plotting') onCancel();
  });

  svg.addEventListener('touchstart',e=>{
    if(sec.plotState==='plotting'){
      handleCellPlotClick(e);
    } else {
      onDown(e);
    }
  },{passive:false});
  svg.addEventListener('touchmove',e=>{
    if(sec.plotState!=='plotting') onMove(e);
  },{passive:false});
  svg.addEventListener('touchend',e=>{
    if(sec.plotState!=='plotting') onUp(e);
  },{passive:false});
  svg.addEventListener('touchcancel',e=>{
    if(sec.plotState!=='plotting') onCancel();
  });

  function handleCellPlotClick(e){
    if(sec.phase!=='running') return;
    const {x,y}=evtXY(e);
    const cell=cellAtXY(x,y);
    if(!cell.inside) return;
    const idx=grayIndex(cell.r,cell.c,sec.problem.varCount);
    cycleCellPlot(sec, idx);
    e.preventDefault();
  }

  sec.el.addEventListener('keydown',e=>{
    if(e.key==='Enter'||e.key===' '){
      if(sec.game&&sec.game.selectedCells.size>0){
        confirmSelectionGroup(sec);
        e.preventDefault();
      }
    }
  });
}

function cycleCellPlot(sec, idx){
  if(sec.plotState!=='plotting') return;
  const isPos = sec.problem && sec.problem.mode === 'pos';
  const cur = sec.userCells.get(idx) || (isPos ? '1' : '0');
  let nxt = '0';
  if(isPos){
    // In POS: default 1 -> 0 -> x -> 1
    nxt = cur==='1' ? '0' : cur==='0' ? 'x' : '1';
  } else {
    // In SOP: default 0 -> 1 -> x -> 0
    nxt = cur==='0' ? '1' : cur==='1' ? 'x' : '0';
  }
  sec.userCells.set(idx, nxt);

  const svg=sec.el.querySelector('.kmap-game-svg');
  if(svg){
    const rect=svg.querySelector(`.km-icell[data-idx="${idx}"]`);
    if(rect){
      rect.classList.remove('one','dc','zero','km-plot-err');
      if(nxt==='1') rect.classList.add('one');
      else if(nxt==='x') rect.classList.add('dc');
      else if(isPos && nxt==='0') rect.classList.add('zero');

      const valEl=rect.nextElementSibling ? rect.nextElementSibling.nextElementSibling : null;
      if(valEl && valEl.classList.contains('km-ival')){
        valEl.textContent=nxt;
        valEl.className='km-ival'+(nxt==='1'?' one':nxt==='x'?' dc':isPos && nxt==='0'?' zero':'');
      }
    }
  }
  updatePlotMatchedChips(sec);
}

function updatePlotMatchedChips(sec){
  if(!sec.problem) return;
  const isPos = sec.problem.mode === 'pos';
  const targetVal = isPos ? '0' : '1';
  const chips=sec.ref.prob.querySelectorAll('.plot-chip');
  chips.forEach(chip=>{
    const m=chip.dataset.plotM, d=chip.dataset.plotD;
    if(m!=null){
      const val=sec.userCells.get(+m);
      chip.classList.toggle('matched', val===targetVal);
    } else if(d!=null){
      const val=sec.userCells.get(+d);
      chip.classList.toggle('matched', val==='x');
    }
  });
}

function doCheckPlotting(sec){
  if(!sec.problem || sec.plotState!=='plotting') return;
  const {varCount, mode, dontcares}=sec.problem;
  const isPos = mode === 'pos';
  const actives = isPos ? sec.problem.maxterms : sec.problem.minterms;
  const targetActiveVal = isPos ? '0' : '1';
  const targetRestVal = isPos ? '1' : '0';
  const total=1<<varCount;
  const dcSet = new Set(dontcares);
  const actSet = new Set(actives);
  const errors=[];

  for(let i=0;i<total;i++){
    const userVal=sec.userCells.get(i) || targetRestVal;
    let expVal = targetRestVal;
    if(actSet.has(i)) expVal = targetActiveVal;
    else if(dcSet.has(i)) expVal = 'x';

    if(userVal!==expVal){
      errors.push({idx:i, userVal, expVal});
    }
  }

  const svg=sec.el.querySelector('.kmap-game-svg');
  if(errors.length>0){
    if(svg){
      errors.forEach(err=>{
        const rect=svg.querySelector(`.km-icell[data-idx="${err.idx}"]`);
        if(rect){
          rect.classList.add('km-plot-err');
          setTimeout(()=>rect.classList.remove('km-plot-err'), 2100);
        }
      });
    }
    const hintText=`⚠️ มี ${errors.length} ช่องที่ยังลงค่าไม่ตรงกับโจทย์ (ช่องที่ผิดจะกระพริบสีแดง)`;
    sec.ref.plothint.innerHTML=`<span style="color:var(--red);font-weight:700">${hintText}</span>`;
    return;
  }

  // All correct!
  sec.ref.plothint.innerHTML=`<span style="color:var(--green);font-weight:700">🎉 ลงค่าตารางถูกต้อง 100%! ปลดล็อกโหมดวงกลุ่ม</span>`;
  setTimeout(()=>{
    unlockGroupingPhase(sec);
  }, 450);
}

function doAutoFillPlot(sec){
  if(!sec.problem) return;
  const {varCount, mode, dontcares}=sec.problem;
  const isPos = mode === 'pos';
  const actives = isPos ? sec.problem.maxterms : sec.problem.minterms;
  const targetActiveVal = isPos ? '0' : '1';
  const targetRestVal = isPos ? '1' : '0';
  const total=1<<varCount;
  const dcSet = new Set(dontcares);
  const actSet = new Set(actives);

  for(let i=0;i<total;i++){
    let val = targetRestVal;
    if(actSet.has(i)) val = targetActiveVal;
    else if(dcSet.has(i)) val = 'x';
    sec.userCells.set(i, val);
  }
  updatePlotMatchedChips(sec);
  unlockGroupingPhase(sec);
}

function unlockGroupingPhase(sec){
  sec.plotState='solved';
  if(sec.ref.plotbar) sec.ref.plotbar.style.display='none';
  if(sec.ref.gamecontrols) sec.ref.gamecontrols.style.display='';
  if(sec.ref.gameinfo) sec.ref.gameinfo.style.display='';
  if(sec.ref.check) {
    sec.ref.check.style.display='';
    sec.ref.check.disabled=false;
  }
  const gd=buildGameKmap(sec.problem, sec);
  sec.ref.kmgame.innerHTML=gd.html;
  clearSelection(sec);
  syncGameBtns(sec);
  updateGameInfo(sec);
  initGameInteraction(sec);
}

function doCheckAnswer(sec){
  if(!sec.problem||!sec.game||sec.game.groups.length===0){
    showGameMsg(sec,'ยังไม่ได้วงกลุ่ม','wrong');
    return;
  }
  const isHardcore = (cfg.playMode && cfg.playMode.value==='hardcore');
  const {varCount, mode}=sec.problem;
  const isPos = mode === 'pos';
  const targetActives = isPos ? sec.problem.maxterms : sec.problem.minterms;
  const targetForbidden = isPos ? sec.problem.minterms : sec.problem.maxterms;
  const forbiddenSet = new Set(targetForbidden);
  const actSet = new Set(targetActives);
  const now=performance.now();

  const userPIs=sec.game.groups.map(g=>g.pi);
  const userLits=userPIs.reduce((a,pi)=>a+literals(pi,varCount),0), userN=userPIs.length;
  const opt=sec.problem.result;
  const optLits=opt.const!=null?0:opt.terms.reduce((a,t)=>a+literals(t,varCount),0);
  const optN=opt.const!=null?(opt.const?1:0):opt.terms.length;
  const timeUsed=sec.timer.mode==='down'?fmt(sec.timer.startBase-tVal(sec.timer,now)):fmt(tVal(sec.timer,now));
  const userExpr=userPIs.map((pi,i)=>`<span style="color:${sec.game.groups[i].color}">${singleTermHTML(pi,varCount,mode)}</span>`).join(isPos?'<span class="op">·</span>':'<span class="op">+</span>');

  // 1. Check if any group covers forbidden cells (0 in SOP, 1 in POS)
  for(const g of sec.game.groups){
    for(const idx of g.cells){
      if(forbiddenSet.has(idx)){
        const errTitle = isPos
          ? '❌ มีกลุ่มที่ครอบคลุม cell ที่เป็น 1 (โหมด POS วงได้เฉพาะ 0 และ x)'
          : '❌ มีกลุ่มที่ครอบคลุม cell ที่เป็น 0 (โหมด SOP วงได้เฉพาะ 1 และ x)';
        if(isHardcore){
          finishHardcoreFail(sec, now, userExpr, userN, userLits, opt, optN, optLits, timeUsed, errTitle);
          return;
        }
        showCheckResult(sec,'wrong',errTitle);
        return;
      }
    }
  }

  // 2. Check for uncovered active terms
  const covered=new Set();
  for(const g of sec.game.groups) for(const idx of g.cells){
    if(actSet.has(idx)) covered.add(idx);
  }
  const uncov=targetActives.filter(m=>!covered.has(m));
  if(uncov.length){
    const errTitle = isPos
      ? `❌ ผิดพลาด — วงไม่ครบ ขาดอีก ${uncov.length} maxterm (0)`
      : `❌ ผิดพลาด — วงไม่ครบ ขาดอีก ${uncov.length} minterm (1)`;
    if(isHardcore){
      finishHardcoreFail(sec, now, userExpr, userN, userLits, opt, optN, optLits, timeUsed, errTitle);
      return;
    }
    const svg=sec.el.querySelector('.kmap-game-svg');
    if(svg){
      const us=new Set(uncov);
      svg.querySelectorAll('.km-icell').forEach(el=>{
        if(us.has(+el.dataset.idx)){
          el.classList.add('km-uncovered');
          setTimeout(()=>el.classList.remove('km-uncovered'),3000);
        }
      });
    }
    showCheckResult(sec,'partial',`⚠️ ยังมี ${uncov.length} ${isPos?'maxterm (0)':'minterm (1)'} ที่ยังไม่ครอบคลุม`);
    return;
  }

  // 3. Check optimality
  const isOpt=userN<=optN&&userLits<=optLits;
  if(!isOpt){
    if(isHardcore){
      finishHardcoreFail(sec, now, userExpr, userN, userLits, opt, optN, optLits, timeUsed, '❌ ผิดพลาด (Hardcore) — ยังลดรูปไม่สั้นที่สุด!');
      return;
    }
    const detail=`คำตอบของคุณ: f = ${userExpr} (<b>${userN}</b> พจน์, <b>${userLits}</b> literal)<br>`+
      `เป้าหมายสั้นที่สุด: <b>${optN}</b> พจน์, <b>${optLits}</b> literal <span style="color:var(--amber)">(ลองรวมกลุ่มให้ใหญ่ขึ้น หรือตัดกลุ่มที่ซ้ำซ้อน)</span>`;
    showCheckResult(sec,'partial','⚠️ ยังไม่ถูกต้อง — ยังลดรูปไม่สั้นที่สุด!',detail);
    return;
  }

  // Correct & optimal!
  if(sec.timer.running) tFreeze(sec.timer,now);
  sec.phase='revealed';
  const isFirstReward = !sec.streakRewarded;
  if(isFirstReward){
    sec.streakRewarded = true;
    onProblemSolved(sec);
  }
  const hardTag = isHardcore ? ' · <span class="chip" style="background:rgba(239,68,68,.18);color:#fca5a5;border:1px solid rgba(239,68,68,.4)">💀 Hardcore Clear</span>' : '';
  const detail=`f = ${userExpr}<br><span class="chip time">ใช้เวลา ${timeUsed}</span> · <span class="chip">${userN} พจน์</span> · <span class="chip">${userLits} literal</span>`+
    (isFirstReward ? ` · <span class="chip" style="background:rgba(251,146,60,.18);color:#fdba74;border:1px solid rgba(251,146,60,.4)">🔥 Streak ${streakStats.current}</span>` : '') + hardTag;
  showCheckResult(sec,'correct',`🎉 ถูกต้อง 100%! ลดรูปสั้นที่สุด (Optimal Minimal ${isPos?'POS':'SOP'})`,detail);
  revealSolutionBox(sec);
  updateCard(sec,now);
}

function finishHardcoreFail(sec, now, userExpr, userN, userLits, opt, optN, optLits, timeUsed, titleMsg){
  if(sec.timer.running) tFreeze(sec.timer,now);
  sec.phase='revealed';
  if(!sec.streakRewarded) onStreakBreak('hardcore_fail');
  const detail=`คำตอบของคุณ: f = ${userExpr} (<b>${userN}</b> พจน์, <b>${userLits}</b> literal)<br>`+
    `เฉลยที่สั้นที่สุด: f = ${exprHTML(opt, sec.problem.mode)} (<b>${optN}</b> พจน์, <b>${optLits}</b> literal)<br>`+
    `<span class="chip time">ใช้เวลา ${timeUsed}</span> · <span class="chip" style="background:rgba(239,68,68,.18);color:#fca5a5;border:1px solid rgba(239,68,68,.4)">💀 Hardcore Fail</span>`;
  showCheckResult(sec,'wrong',titleMsg,detail);
  revealSolutionBox(sec);
  updateCard(sec,now);
}

function revealSolutionBox(sec){
  if(!sec.problem) return;
  const res=sec.problem.result;
  const isPos = sec.problem.mode === 'pos';
  sec.ref.eq.innerHTML='f = '+exprHTML(res, sec.problem.mode);
  const terms=res.const!=null?(res.const===1?1:0):res.terms.length;
  const lits=res.const!=null?0:res.terms.reduce((a,t)=>a+literals(t,res.varCount),0);
  sec.ref.ansmeta.innerHTML=`<span class="chip">${terms} ${isPos?'พจน์บวก (Sum)':'พจน์คูณ (Product)'}</span><span class="chip">${lits} literal</span>`;
  sec.ref.kmap.innerHTML=buildKmapSVG(sec.problem,res);
  const ansLabel = sec.ref.answer.querySelector('.ans-label');
  if(ansLabel){
    ansLabel.innerHTML = `✓ เฉลย — สมการที่สั้นที่สุด (Minimal ${isPos?'POS':'SOP'}) <button class="mini" data-copy>คัดลอก</button>`;
    const cpBtn = ansLabel.querySelector('[data-copy]');
    if(cpBtn){
      cpBtn.onclick = () => {
        navigator.clipboard.writeText(exprPlain(res, sec.problem.mode));
        showGameMsg(sec,'คัดลอกสมการแล้ว','good');
      };
    }
  }
  sec.ref.answer.classList.add('show');
  if(sec.ref.check) sec.ref.check.disabled=true;
  if(sec.ref.reveal) sec.ref.reveal.disabled=true;
}

function syncAllCheckBtns(){
  const isHc = cfg.playMode && cfg.playMode.value === 'hardcore';
  state.sections.forEach(sec=>{
    if(sec.ref && sec.ref.check){
      sec.ref.check.innerHTML = isHc ? '💀 ส่งคำตอบ' : '✓ ตรวจ';
      sec.ref.check.style.color = isHc ? '#f87171' : 'var(--cyan)';
      sec.ref.check.style.borderColor = isHc ? 'rgba(248,113,122,.5)' : 'rgba(34,211,238,.45)';
    }
  });
}

function showCheckResult(sec,type,msg,detail){
  const el=sec.ref.result; if(!el) return;
  el.className='km-result show '+type;
  el.innerHTML=`<div class="result-text">${msg}</div>`+(detail?`<div class="result-detail">${detail}</div>`:'');
}
function setupGameUI(sec,show){
  if(show){
    initGameState(sec);
    const isManual = (cfg.plotMode && cfg.plotMode.value==='manual');
    const isPos = sec.problem && sec.problem.mode === 'pos';
    sec.plotState = isManual ? 'plotting' : 'solved';
    sec.userCells = new Map();
    if(isManual){
      const total = 1<<sec.problem.varCount;
      const defVal = isPos ? '1' : '0';
      for(let i=0; i<total; i++) sec.userCells.set(i, defVal);
    }

    const gd=buildGameKmap(sec.problem, sec);
    sec.game.x0=gd.x0;sec.game.y0=gd.y0;sec.game.cw=gd.cw;sec.game.ch=gd.ch;
    sec.ref.kmgame.innerHTML=gd.html;
    sec.ref.kmgame.classList.add('show');

    if(isManual){
      sec.ref.plotbar.style.display='flex';
      sec.ref.plothint.innerHTML=isPos
        ? 'คลิกที่ช่องเพื่อสลับค่า: 1 → 0 → x (เสร็จแล้วกด "ตรวจการลงตาราง")'
        : 'คลิกที่ช่องเพื่อสลับค่า: 0 → 1 → x (เสร็จแล้วกด "ตรวจการลงตาราง")';
      sec.ref.gamecontrols.style.display='none';
      sec.ref.gameinfo.style.display='none';
      sec.ref.check.style.display='none';
      updatePlotMatchedChips(sec);
    } else {
      sec.ref.plotbar.style.display='none';
      sec.ref.gamecontrols.style.display='';
      sec.ref.gameinfo.style.display='';
      sec.ref.check.style.display='';
      sec.ref.check.disabled=false;
      clearSelection(sec);
      syncGameBtns(sec); updateGameInfo(sec);
    }
    syncAllCheckBtns();
    initGameInteraction(sec);
  }else{
    sec.ref.kmgame.classList.remove('show'); sec.ref.kmgame.innerHTML='';
    sec.ref.plotbar.style.display='none';
    sec.ref.gamecontrols.style.display='none';
    sec.ref.gameinfo.style.display='none';
    sec.ref.check.style.display='none';
    if(sec.ref.selectbar) sec.ref.selectbar.style.display='none';
    sec.ref.result.className='km-result'; sec.ref.result.innerHTML='';
    sec.game=null;
  }
}

/* ---- per-frame timer/UI update ---- */
function updateCard(sec,now){
  const t=sec.timer, r=sec.ref;
  let v=tVal(t,now);
  if(t.mode==='down'&&t.running&&v<=0){
    v=0; t.base=0; t.running=false;
    if(sec.phase==='running'){
      sec.phase='timeout';
      if(!sec.streakRewarded){
        onStreakBreak('timeout');
      }
    }
  }

  // card class (method color + phase state) — only rewrite when it actually changes,
  // otherwise the 200ms tick perpetually restarts the border/background transitions and freezes them
  const mcls = sec.problem ? ' m-'+sec.problem.method : '';
  const cls='card'+mcls+(sec.phase==='running'?' running':sec.phase==='revealed'?' revealed':sec.phase==='timeout'?' timeout':'');
  if(sec.el.className!==cls) sec.el.className=cls;

  // clock text + color
  if(sec.phase==='idle'){
    r.clock.className='t-clock idle';
    r.clock.textContent = t.mode!=='down' ? '00:00' : fmt(targetMs());
    r.status.className='t-status'; r.status.textContent='พร้อมสร้างโจทย์';
    r.fill.className='t-fill'; r.fill.style.width='100%'; r.fill.style.background='var(--bg4)';
    return;
  }
  r.clock.textContent=fmt(v);

  if(sec.phase==='timeout'){
    r.clock.className='t-clock done';
    r.status.className='t-status done'; r.status.innerHTML='⏱ หมดเวลา!';
    r.fill.className='t-fill'; r.fill.style.width='100%'; r.fill.style.background='var(--red)';
  }else if(sec.phase==='revealed'){
    r.clock.className='t-clock';
    r.status.className='t-status rev'; r.status.innerHTML='เฉลยแล้ว';
    r.fill.className='t-fill'; r.fill.style.background='var(--green)';
    if(t.mode==='down'){r.fill.style.width=(t.startBase?Math.max(0,v)/t.startBase*100:0)+'%';}
    else{r.fill.style.width='100%';}
  }else{ // running
    if(t.mode==='down'){
      const frac=t.startBase?v/t.startBase:0;
      r.clock.className='t-clock'+(frac<=0.1?' crit':frac<=0.35?' warn':'');
      r.fill.className='t-fill'; r.fill.style.width=Math.max(0,frac*100)+'%';
      r.fill.style.background=frac<=0.1?'var(--red)':frac<=0.35?'var(--amber)':'var(--green)';
    }else{
      r.clock.className='t-clock';
      r.fill.className='t-fill up'; r.fill.style.width='100%';
    }
    const paused=t.pausedByGlobal;
    r.status.className='t-status run';
    r.status.innerHTML=paused?'<span class="dot" style="background:var(--amber)"></span>หยุดชั่วคราว':'<span class="dot pulse"></span>กำลังจับเวลา…';
  }
}

/* ---- global tick ---- */
function tick(){ const now=performance.now(); for(const s of state.sections) updateCard(s,now); }
setInterval(tick,200);

/* ---- section count / columns ---- */
function setCount(n){
  n=Math.max(1,Math.min(40,n|0));
  while(state.sections.length<n){const s=createSection();state.sections.push(s);grid.appendChild(s.el);}
  while(state.sections.length>n){const s=state.sections.pop();s.el.remove();}
  updateLayout();
  tick();
}
/* The grid fills the viewport: cols × rows tiles divide the screen, so the whole
   app stays on one screen and sections shrink as count/cols grow (no page scroll). */
function effectiveCols(){
  const sel=+cfg.cols.value||4, w=window.innerWidth;
  if(w<=720)return 1;
  if(w<=1200)return Math.min(sel,2);
  return sel;
}
const GRID_GAP=14;
function updateLayout(){
  const c=effectiveCols(), rows=Math.max(1,Math.ceil(state.sections.length/c)), root=document.documentElement;
  root.style.setProperty('--cols',c);
  root.style.setProperty('--rows',rows);
  // predict resulting card height and shrink section content in tiers if it would be short
  const mainEl=document.querySelector('main');
  const cardH=(mainEl.clientHeight-(rows-1)*GRID_GAP)/rows;
  document.body.classList.toggle('compact', cardH>0 && cardH<400);
  document.body.classList.toggle('tiny', cardH>0 && cardH<332);
}

/* ---- global actions ---- */
$('gGen').onclick=()=>{state.pausedAll=false;syncPauseBtn();state.sections.forEach(doGenerate);};
$('gReveal').onclick=()=>state.sections.forEach(s=>{if(s.problem)doReveal(s);});
$('gClear').onclick=()=>state.sections.forEach(doClear);
$('gPause').onclick=()=>{
  const now=performance.now();
  state.pausedAll=!state.pausedAll;
  state.sections.forEach(s=>{
    if(s.phase!=='running')return;
    if(state.pausedAll){ if(s.timer.running){tFreeze(s.timer,now);s.timer.pausedByGlobal=true;} }
    else{ if(s.timer.pausedByGlobal){tRun(s.timer,now);s.timer.pausedByGlobal=false;} }
  });
  syncPauseBtn(); tick();
};
function syncPauseBtn(){const b=$('gPause');b.innerHTML=state.pausedAll?'<span class="ic">▶</span> เล่นต่อทั้งหมด':'<span class="ic">⏸</span> หยุดทั้งหมด';b.classList.toggle('primary',state.pausedAll);b.classList.toggle('warn',!state.pausedAll);}

/* ---- config listeners ---- */
cfg.count.onchange=()=>setCount(+cfg.count.value);
cfg.cols.onchange=()=>updateLayout();
window.addEventListener('resize',updateLayout);
window.addEventListener('load',updateLayout);   // settle after fonts/layout finalize
cfg.tmode.onchange=()=>{const up=cfg.tmode.value==='up';
  $('timeFieldK').style.opacity=up?'.45':'1';
  [cfg.minK,cfg.secK].forEach(i=>i.disabled=up);
  state.sections.forEach(s=>{if(s.phase==='idle')s.timer=newTimer(cfg.tmode.value);});tick();};
[cfg.minK,cfg.secK].forEach(inp=>inp.onchange=()=>tick());
cfg.vars.onchange=()=>{ state.sections.forEach(s=>{ if(s.phase==='running') doGenerate(s); }); tick(); };
cfg.logicMode.onchange=()=>{ state.sections.forEach(s=>{ if(s.phase==='running') doGenerate(s); }); tick(); };
cfg.difficulty.onchange=()=>{ state.sections.forEach(s=>{ if(s.phase==='running') doGenerate(s); }); tick(); };
cfg.plotMode.onchange=()=>{ state.sections.forEach(s=>{ if(s.phase==='running') setupGameUI(s, true); }); };
cfg.playMode.onchange=()=>syncAllCheckBtns();

/* ---- streak reset button ---- */
const sResetBtn = $('streakResetBtn');
if(sResetBtn){
  sResetBtn.onclick=()=>{
    if(confirm('ต้องการรีเซ็ตสถิติ Streak และจำนวนข้อที่ทำถูกทั้งหมดหรือไม่?')){
      streakStats={current:0,best:0,total:0};
      updateStreakUI();
      showStreakToast('↺ รีเซ็ตสถิติ Streak เรียบร้อยแล้ว');
    }
  };
}

/* ---- init ---- */
setCount(+cfg.count.value);
updateLayout();
syncPauseBtn();
updateStreakUI();
</script>
